version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: taskflow_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - taskflow-network

  # Redis Cache & Message Broker Service
  redis:
    image: redis:7-alpine
    container_name: taskflow_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - taskflow-network

  # Backend REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/taskflow_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "taskflow_super_secret_jwt_key_2026_production"
      CLIENT_URL: "http://localhost:5173"
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    networks:
      - taskflow-network

  # Frontend Web Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - taskflow-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  taskflow-network:
    driver: bridge
